name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The hook self-test is the only Python in this repository, so one Python version
  # is enough here. The 3.12/3.13 matrix rule of the kit targets Python repositories.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Review gate hook self-test
        run: python .claude/hooks/role_gate.py --self-test

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # The scaffold crate has no dependencies yet; ticket #10 adds sha1 and flate2
    # (vendored) and pins the exact toolchain in rust-toolchain.toml.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        shell: bash
        # rustup is preinstalled on GitHub runners; rust-toolchain.toml selects stable
        # until ticket #10 pins one release.
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version
          cargo --version
          git --version
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        # run even if an earlier step failed, so every check reports
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --locked --offline -- -D warnings
      - name: cargo build
        if: ${{ !cancelled() }}
        run: cargo build --locked --offline
      - name: cargo test
        if: ${{ !cancelled() }}
        run: cargo test --locked --offline
