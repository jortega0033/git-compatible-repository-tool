version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # The crate does not exist yet (ticket #2 creates Cargo.toml); Dependabot ignores
  # a directory without a manifest until then.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
